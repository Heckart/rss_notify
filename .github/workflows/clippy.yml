name: Rust Lint

on: [push, pull_request]

jobs:
  Clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Rust lint
        run: cargo clippy --all-targets -- -Dwarnings
